[project]
name = "gh-puller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "claude-agent-sdk>=0.2.142",
    "dash>=4.4.0",
    "dash-cytoscape>=1.0.2",
    "deepseek-harness-sdk",
    "fastapi>=0.139.0",
    "flask",
    "httpx",
    "jsonschema>=4.26.0",
    "openai>=2.45.0",
    "openai-codex>=0.147.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "python-dateutil",
    "python-dotenv",
    "scipy>=1.18.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1",
]


[project.scripts]
benchmark = "gh_puller.benchmark.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
include = ["gh_puller*"]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["archive", "outputs", "gh_puller.egg-info"]

# 全量启用 + 定向豁免:豁免规则=与本项目有意风格冲突的误报,理由逐条注释。
# 配套注释规范见 AGENTS.md「Python 注释规范」;两个文件须同改。
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # 中文文本误报:全角标点/中文句读被误判为"歧义 Unicode"
    "RUF001", "RUF002", "RUF003",
    # 英文句号/首词大写对中文 docstring 不适用(D400/D401 已由 google convention 排除)
    "D415", "D403",
    # 函数/方法 docstring 按契约增补不强制(签名即文档);模块/包级仍强制(D100/D104)
    "D101", "D102", "D103", "D105", "D107",
    # 类型标注不强制全量(研究型代码,部分标注是有意的)
    "ANN",
    # 有意风格:接口形参按契约保留/跨模块访问内部属性/宽捕获/lazy import/相对导入/os.path/布尔位置传参
    "ARG", "SLF001", "BLE001", "PLC0415", "TID252", "PTH", "FBT",
    # 有意风格:异常消息直接字符串;print 是 CLI/脚本合法输出;raise 后由上游统一降级是有意控制流
    "EM", "TRY003", "T201", "TRY301",
    # 有意设计:模块态单例(configs/sinks「唯一模块态」层级纪律);git CLI 固定命令列表传参(隔离链设计)
    "PLW0602", "PLW0603", "S603", "S607",
    # 有意风格:camelCase 字段名即 wire/落盘键(wiki/codemap 契约)、数学/上游命名
    "N803", "N806", "N815",
    # 规模指标(复杂度/参数量/魔法数)不是本仓质量门槛
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    # 版权头;TODO 格式由注释规范约定;测试组合断言
    "CPY001", "TD", "FIX", "PT018",
]

[tool.ruff.lint.pydocstyle]
convention = "google" # 取其对中文 docstring 友好的排除集(英文句号/祈使语气等不适用)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "INP001", "D100", "D104"]

[tool.uv.sources]
deepseek-harness-sdk = { path = "../deepseek-harness/python/sdk", editable = true }
deepseek-harness-runtime-bin = { path = "../deepseek-harness/python/sdk-runtime", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# 根 pytest 只跑 tests/:apps/* 是独立 uv 项目(各自 pyproject+venv,按 AGENTS.md
# 约定单独跑);裸 `uv run pytest` 会连带收集 apps/archive/playground 的 tests,
# 触发 pytest_plugins 非顶层等 collection 错误。
[tool.pytest.ini_options]
testpaths = ["tests"]
