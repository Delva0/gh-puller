[project]
name = "gh-puller"
version = "0.1.0"
description = "Incremental GitHub archives and code knowledge tooling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
agent = [
    "claude-agent-sdk>=0.2.142",
    "openai-codex>=0.147.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "websockets>=16.1",
]
benchmark = [
    "claude-agent-sdk>=0.2.142",
    "fastapi>=0.139.0",
    "jsonschema>=4.26.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]
codebase = [
    "networkx>=3.4",
]

[project.scripts]
benchmark = "gh_puller.benchmark.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gh_puller*"]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.uv.sources]
deepseek-harness-sdk = { path = "../deepseek-harness/python/sdk", editable = true }
deepseek-harness-runtime-bin = { path = "../deepseek-harness/python/sdk-runtime", editable = true }

[dependency-groups]
dev = [
    "gh-puller[agent,benchmark,codebase]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
dsh = [
    "deepseek-harness-sdk",
]

[tool.pytest.ini_options]
addopts = "-m 'not real'"
markers = [
    "integration: deterministic tests crossing process, socket, or storage boundaries",
    "real: opt-in tests requiring local agents, credentials, or paid providers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["archive", "outputs", "gh_puller.egg-info"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "D415", "D403",
    "D101", "D102", "D103", "D105", "D107",
    "ANN",
    "ARG", "SLF001", "BLE001", "PLC0415", "TID252", "PTH", "FBT",
    "EM", "TRY003", "T201", "TRY301",
    "PLW0602", "PLW0603", "S603", "S607",
    "N803", "N806", "N815",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "CPY001", "TD", "FIX", "PT018",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "INP001", "D100", "D104"]
