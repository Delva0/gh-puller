[project]
name = "gh-puller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "claude-agent-sdk>=0.2.142",
    "dash>=4.4.0",
    "dash-cytoscape>=1.0.2",
    # "deepseek-harness-sdk",
    "fastapi>=0.139.0",
    "flask",
    "httpx",
    "jsonschema>=4.26.0",
    "openai>=2.45.0",
    "openai-codex>=0.147.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "python-dateutil",
    "python-dotenv",
    "scipy>=1.18.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1",
]


[project.scripts]
benchmark = "gh_puller.benchmark.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
include = ["gh_puller*"]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["archive", "outputs", "gh_puller.egg-info"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "D415", "D403",
    "D101", "D102", "D103", "D105", "D107",
    "ANN",
    "ARG", "SLF001", "BLE001", "PLC0415", "TID252", "PTH", "FBT",
    "EM", "TRY003", "T201", "TRY301",
    "PLW0602", "PLW0603", "S603", "S607",
    "N803", "N806", "N815",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "CPY001", "TD", "FIX", "PT018",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "INP001", "D100", "D104"]

[tool.uv.sources]
# deepseek-harness-sdk = { path = "../deepseek-harness/python/sdk", editable = true }
# deepseek-harness-runtime-bin = { path = "../deepseek-harness/python/sdk-runtime", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# 根 pytest 只跑 tests/:apps/* 是独立 uv 项目(各自 pyproject+venv,按 AGENTS.md
# 约定单独跑);裸 `uv run pytest` 会连带收集 apps/archive/playground 的 tests,
# 触发 pytest_plugins 非顶层等 collection 错误。
[tool.pytest.ini_options]
testpaths = ["tests"]
