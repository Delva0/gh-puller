# pnpm owns JavaScript dependencies; uv independently owns Python dependencies.
packages:
  - ui
  - apps/deepwiki-webui/web
  - apps/agent-monitor/web
  # The DSH plugin commits its built library; uv owns its Python server.
  - apps/dsh-gh-puller
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true

# micromark-extension-math augments these types; duplicate versions split the
# TokenTypeMap augmentation from Effects in the vendored panel build.
overrides:
  micromark-util-types: 2.0.2
