# ui 为本项目共享 UI 组件包(@gh-puller/ui,自持 package.json,apps 经 workspace:* 依赖);
# 与根 pyproject.toml / uv.lock 共存,uv 管 Python、pnpm 管 JS
packages:
  - ui
  - apps/deepwiki-webui/web
  - apps/agent-monitor/web
  # dsh 插件(TS 源 + vitest,构建产物 lib/ 提交;server/ 为 Python 侧,由 uv 管)
  - apps/dsh-gh-puller
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true

# 单版本固化:micromark-util-types 的 .d.ts 被 micromark-extension-math 增强,
# 双版本并存会让 TokenTypeMap 增强与 Effects 类型分裂(见 vendor 面板编译)。
overrides:
  micromark-util-types: 2.0.2
