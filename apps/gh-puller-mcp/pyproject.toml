[project]
name = "gh-puller-mcp"
version = "0.2.0"
description = "gh-puller 的 MCP 服务器(代码库知识图谱工具桌)"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.1.1",
    "uvicorn>=0.31.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gh_puller_mcp*"]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = [
    "e2e: process-level protocol tests requiring executables or external state",
    "integration: deterministic tests crossing process, socket, or storage boundaries",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "D415", "D403",
    "D101", "D102", "D103", "D105", "D107",
    "ANN",
    "ARG", "SLF001", "BLE001", "PLC0415", "TID252", "PTH", "FBT",
    "EM", "TRY003", "T201", "TRY301",
    "PLW0602", "PLW0603", "S603", "S607",
    "N803", "N806", "N815",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "CPY001", "TD", "FIX", "PT018",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S108", "S310", "INP001", "D100", "D104"]
