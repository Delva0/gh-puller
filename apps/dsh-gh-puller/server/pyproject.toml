[project]
name = "gh-puller-dsh"
version = "0.1.0"
description = "dsh 插件侧 graphify worker(常驻子进程,NDJSON stdio);core 语义镜像 deepwiki._graphify_server"
requires-python = ">=3.13"
dependencies = [
    "gh-puller",
    "python-dotenv>=1.2.3",
]

[project.scripts]
gh-graphify-worker = "gh_puller_dsh.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# gh-puller → openai-codex 在默认镜像不存在,须显式 pypi.org 索引(同根/webui,见 codex 适配事实)
[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.uv.sources]
gh-puller = { path = "../../..", editable = true }
graphifyy = { path = "../../../../graphify", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
