[project]
name = "gh-puller-webui-api"
version = "0.1.0"
description = "DeepWiki 兼容后端 HTTP 服务(端点层);引擎与任务复用 gh_puller"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.142",
    "fastapi>=0.139.0",
    "gh-puller",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
gh-puller = { path = "../../..", editable = true }
graphifyy = { path = "../../../../graphify", editable = true }

[dependency-groups]
dev = [
    "httpx",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
