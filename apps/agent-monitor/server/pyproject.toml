[project]
name = "gh-puller-agent-monitor"
version = "0.1.0"
description = "Agent monitor local history projection and WebSocket viewer"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "gh-puller",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.uv.sources]
gh-puller = { path = "../../..", editable = true }

[dependency-groups]
dev = [
    "httpx",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "D415", "D403",
    "D101", "D102", "D103", "D105", "D107",
    "ANN",
    "ARG", "SLF001", "BLE001", "PLC0415", "TID252", "PTH", "FBT",
    "EM", "TRY003", "T201", "TRY301",
    "PLW0602", "PLW0603", "S603", "S607",
    "N803", "N806", "N815",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "CPY001", "TD", "FIX", "PT018",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "INP001", "D100", "D104"]
