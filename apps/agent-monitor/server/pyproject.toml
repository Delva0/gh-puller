[project]
name = "gh-puller-agent-monitor"
version = "0.1.0"
description = "Agent 监控 Web/WS hub(FastAPI 端点层);事件模型与配置复用 gh_puller"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "gh-puller",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.uv.sources]
gh-puller = { path = "../../..", editable = true }

[dependency-groups]
dev = [
    "httpx",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
